# Railway Deployment Configuration
# This file tells Railway how to deploy your FastAPI backend

[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "python rag_api_production.py"
healthcheckPath = "/health"
healthcheckTimeout = 120  # Reduced timeout since health check is simpler
restartPolicyType = "ON_FAILURE"

[env]
PYTHONPATH = "/app"
PORT = "8001"
VECTOR_BACKEND = "supabase"
EMB_MODEL = "sentence-transformers/all-MiniLM-L6-v2"
USE_LOCAL_EMBEDDINGS = "true"
GEN_MODEL = "mistralai/mistral-small-3.2-24b-instruct:free"
MAX_CONTEXT_TOKENS = "8000"
CHUNK_SIZE = "1200"
CHUNK_OVERLAP = "200"
